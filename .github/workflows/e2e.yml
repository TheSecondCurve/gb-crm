name: e2e

# K28：Playwright 冒烟独立于 ci.yml，continue-on-error，不挡合并。
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
