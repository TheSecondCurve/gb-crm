# 合并 main 即发布:hk-build 自托管 runner(hk-dev)构建镜像推 ACR,
# 再经 SSH 受限密钥(forced command)回源执行部署脚本——不依赖本机 self-hosted
# runner,绕开 org runner group 仓库清单限制。
# 服务器侧:deploy 用户 + /usr/local/bin/deploy-gbcrm.sh(只做 pull/up/冒烟)。
# 部署直连 hk-dev 85.189.89.26:3355(runner 与目标同机,零中转依赖;
# 原中转 207.57.130.82:22 已失效——从 runner 所在机出发被过滤)。
# DEPLOY_HOST_KEY 须为 "[85.189.89.26]:3355" 前缀的 known_hosts 条目。
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: [self-hosted, hk-build]
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ACR(重试抗跨境瞬断)
        run: |
          for i in 1 2 3 4 5; do
            echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin && break
            echo "login 失败,第 $i 次重试"; sleep 5
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/girlboss/gb-crm:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/girlboss/gb-crm:main
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH 受限部署到测试机
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          ssh -p 3355 -i ~/.ssh/deploy_key deploy@85.189.89.26
